<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title th:text="#{email.welcome.title}">Welcome!</title>
    <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
    }
    .container {
      background-color: #ffffff;
      max-width: 600px;
      margin: 30px auto;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .header {
      background-color: #004aad;
      padding: 20px;
      text-align: center;
      color: white;
    }
    .content {
      padding: 30px;
      text-align: left;
      color: #333;
    }
    .footer {
      background-color: #fafafa;
      text-align: center;
      padding: 10px;
      font-size: 12px;
      color: #999;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      background-color: #004aad;
      color: white;
      border-radius: 6px;
      text-decoration: none;
    }
  </style>
</head>
<body>
<div class="container">
    <div class="header">
        <img th:src="${logoUrl}" alt="Logo" width="100" height="100"/>
        <h2 th:text="#{email.welcome.header}">Welcome!</h2>
    </div>

    <div class="content">
        <p th:text="#{email.welcome.greeting(${name})}">
            Hi, John Doe!
        </p>
        <p th:text="#{email.welcome.body}">
            Thank you for joining our platform. We’re thrilled to have you!
        </p>
        <a href="https://yourapp.com" class="btn" th:text="#{email.welcome.button}">Visit our site</a>
    </div>

    <div class="footer">
        <p th:text="#{email.footer.note(${supportEmail})}">
            Need help? Contact us at support@yourapp.com
        </p>
    </div>
</div>
</body>
</html>
